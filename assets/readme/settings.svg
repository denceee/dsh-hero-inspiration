<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="hi-set-title hi-set-desc">
  <title id="hi-set-title">心灵鸡汤 的设置页</title>
  <desc id="hi-set-desc">设置页只有两件事：一个显示开关，和一个可以直接编辑的句库文本框。文本框里预填了内置的 40 句，右下角显示句库来源与句数。</desc>

  <defs>
    <clipPath id="hi-set-clip"><rect width="1200" height="520" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#hi-set-clip)">
    <rect width="1200" height="520" fill="#0b0e14"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="23.5" fill="none" stroke="#1b2331"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="64" y="78" font-size="40" font-weight="600" fill="#e9eef7">设置 · 心灵鸡汤</text>
    <text x="64" y="118" font-size="21" fill="#8593a8">改完即时生效，没有保存按钮。</text>

    <!-- visibility row -->
    <rect x="64" y="146" width="1072" height="88" rx="16" fill="#141a24" stroke="#232c3a"/>
    <text x="96" y="190" font-size="22" fill="#e9eef7">在新建对话页显示</text>
    <text x="96" y="216" font-size="19" fill="#8593a8">关闭后标题下方不再显示任何句子。</text>
    <rect x="1052" y="191" width="44" height="24" rx="12" fill="#4a7ff0"/>
    <circle cx="1084" cy="203" r="9" fill="#ffffff"/>

    <!-- pool card -->
    <rect x="64" y="250" width="1072" height="230" rx="16" fill="#141a24" stroke="#232c3a"/>
    <text x="96" y="292" font-size="22" fill="#e9eef7">句库</text>
    <text x="1104" y="292" font-size="19" fill="#8593a8" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">内置句库 · 40 句</text>
    <text x="96" y="318" font-size="19" fill="#8593a8">每行一句。内置的 40 句已经填好，直接改就行；</text>
    <text x="96" y="342" font-size="19" fill="#8593a8">全部清空则回到内置句库。</text>

    <rect x="96" y="356" width="1008" height="88" rx="10" fill="#0b0e14" stroke="#232c3a"/>
    <text x="118" y="386" font-size="19" fill="#c2cddd">山高路远，走下去才知道风声有多好。</text>
    <text x="118" y="412" font-size="19" fill="#c2cddd">你现在的笨拙，是熟练之前的必经之路。</text>
    <text x="118" y="438" font-size="19" fill="#c2cddd">慢一点没关系，方向对了就行。</text>
  </g>
</svg>
