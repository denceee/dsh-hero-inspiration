<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hi-hero-title hi-hero-desc">
  <title id="hi-hero-title">心灵鸡汤 — DeepSeek Harness 本地插件</title>
  <desc id="hi-hero-desc">左侧是插件名称与说明；右侧是新对话页的真实结构示意：标题「探索未至之境」，下方一行由两个圆点夹住的鼓励语，再下方是工作区选择行。</desc>

  <defs>
    <clipPath id="hi-hero-clip"><rect width="1200" height="400" rx="24"/></clipPath>
    <linearGradient id="hi-hero-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7ff0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fe3b4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#hi-hero-clip)">
    <rect width="1200" height="400" fill="#0b0e14"/>
    <rect width="1200" height="400" fill="url(#hi-hero-glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#1b2331"/>

  <!-- title block -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="64" y="86" font-size="19" letter-spacing="1.6" fill="#8593a8"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DEEPSEEK HARNESS · 本地插件</text>
    <text x="64" y="168" font-size="72" font-weight="600" fill="#e9eef7">心灵鸡汤</text>
    <text x="64" y="226" font-size="29" fill="#c2cddd">每次新建对话，标题下方多一句鼓励</text>
    <text x="64" y="264" font-size="29" fill="#c2cddd">一轮 40 句不重复，句子可以自己写</text>
    <text x="64" y="322" font-size="19" fill="#8593a8"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dsh-hero-inspiration</text>
    <text x="64" y="350" font-size="18" fill="#6f7d92"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">中英双语 · 点击换一句 · 设置里可改句库</text>
  </g>

  <!-- where the line lands, drawn from the plugin's own row -->
  <g id="placement-board" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="664" y="52" width="472" height="296" rx="16" fill="#141a24" stroke="#232c3a"/>

    <text x="900" y="118" font-size="34" font-weight="500" fill="#e9eef7" text-anchor="middle">探索未至之境</text>

    <text x="900" y="178" font-size="21" fill="#a9b6c8" text-anchor="middle">山高路远，走下去才知道风声有多好。</text>
    <circle cx="702" cy="171" r="3.5" fill="#4a7ff0" opacity="0.9"/>
    <circle cx="1098" cy="171" r="3.5" fill="#4a7ff0" opacity="0.9"/>

    <text x="696" y="240" font-size="19" fill="#8593a8">选择工作区</text>
    <text x="696" y="304" font-size="18" fill="#6f7d92"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">标题下方 · 工作区上方</text>
  </g>
</svg>
